# Alembic configuration for the Ankh Marketplace backend.
#
# Run from backend/:
#     .venv/bin/alembic upgrade head
#
# The database URL is NOT set here. env.py pulls it from app.database, which
# reads the DATABASE_URL environment variable and falls back to the SQLite file
# at backend/ankh_marketplace.db. That keeps one source of truth for the URL.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Intentionally blank — overridden in env.py. See note above.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
