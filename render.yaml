# Render Blueprint — https://render.com/docs/blueprint-spec

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: ankh-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/categories
    disk:
      name: sqlite-disk
      mountPath: /app/db_data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/db_data/ankh_marketplace.db
      - key: ANKH_SECRET_KEY
        generateValue: true
      - key: DEPLOYMENT_ENV
        value: production
      - key: ANKH_ALLOWED_ORIGINS
        value: https://ankh-web.onrender.com
      - key: ANKH_JWT_ALGORITHM
        value: HS256
      - key: ANKH_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ANKH_AI_ENABLED
        value: "false"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: ankh-web
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: REACT_APP_BACKEND_ENDPOINT
        value: https://ankh-api.onrender.com
