# nginx config for the CRA bundle. Rendered from a template at container start
# so ${PORT} picks up whatever Render assigns (see NGINX_ENVSUBST_FILTER in the
# Dockerfile — only PORT is substituted, so $uri below survives).

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health probe that does not depend on the SPA shell rendering.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed filenames (main.<hash>.js) are content-addressed, so they can be
    # cached indefinitely — a new build produces a new name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a returning visitor keeps loading the
    # previous deploy's asset references after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The SPA rewrite. react-router v5 owns client-side routes, so a hard
    # refresh on a deep link like /products/:id must return index.html rather
    # than 404 on a file that does not exist.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
